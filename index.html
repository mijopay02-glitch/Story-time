<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MIJO Story — Socle</title>

<!-- Polices -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
/>

<!-- Tailwind CSS (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: {
            DEFAULT: '#0a0f1c',
            soft: '#121a2e',
            elevated: '#182342',
            line: '#24304f',
          },
          gold: {
            DEFAULT: '#d4a03d',
            light: '#f0cd7c',
          },
        },
        fontFamily: {
          display: ['Sora', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
        },
      },
    },
  };
</script>

<link rel="stylesheet" href="style.css" />

<!-- Client Supabase (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-navy text-[15px] antialiased min-h-screen flex flex-col">
  <!-- En-tête -->
  <header class="hero-glow relative border-b border-navy-line">
    <div class="flex items-center h-1 w-full spine-accent"></div>
    <div class="flex items-center justify-between px-5 py-4">
      <div class="flex items-center gap-2">
        <span class="font-display font-extrabold tracking-tight text-lg text-gold-light">MIJO</span>
        <span class="font-display font-semibold text-lg text-[color:var(--text-primary)]">Story</span>
      </div>

      <!-- Profil anonyme -->
      <button
        id="edit-pseudo-btn"
        class="flex items-center gap-2 bg-navy-elevated hover:bg-navy-line transition-colors border border-navy-line rounded-full pl-1.5 pr-3 py-1.5"
        title="Modifier mon pseudo"
      >
        <span
          class="flex items-center justify-center w-6 h-6 rounded-full bg-gold/20 text-gold-light text-xs font-display font-bold"
        >L</span>
        <span id="user-pseudo" class="text-sm font-medium text-[color:var(--text-primary)]"></span>
        <input
          id="user-pseudo-input"
          class="hidden bg-transparent border-b border-gold text-sm font-medium w-28 text-[color:var(--text-primary)]"
          maxlength="24"
        />
      </button>
    </div>
  </header>

  <!-- Barre de filtres par catégorie -->
  <nav
    id="category-filters"
    class="flex gap-2 overflow-x-auto scrollbar-hide px-5 py-3 border-b border-navy-line bg-navy-soft/40"
  ></nav>

  <!-- Contenu principal -->
  <main class="flex-1 px-5 py-6 max-w-md w-full mx-auto">
    <!-- Chargement -->
    <div id="stories-loader" class="flex flex-col items-center justify-center py-24 gap-3">
      <div class="w-7 h-7 rounded-full border-2 border-navy-line border-t-gold animate-spin"></div>
      <p class="text-xs text-[color:var(--text-muted)]">Chargement des histoires…</p>
    </div>

    <!-- Erreur -->
    <div id="stories-error" class="hidden flex-col items-center text-center py-24 gap-2">
      <p class="font-display font-semibold text-[color:var(--text-primary)]">
        Impossible de charger les histoires
      </p>
      <p id="stories-error-msg" class="text-xs text-[color:var(--text-muted)] max-w-xs">
        Vérifiez votre connexion internet et réessayez.
      </p>
      <button
        id="retry-btn"
        class="mt-3 text-xs font-display font-semibold text-navy bg-gold hover:bg-gold-light transition-colors rounded-full px-5 py-2"
      >
        Réessayer
      </button>
    </div>

    <!-- Aucun résultat -->
    <div id="stories-empty" class="hidden flex-col items-center text-center py-24 gap-2">
      <p class="font-display font-semibold text-[color:var(--text-primary)]">Aucune histoire ici</p>
      <p class="text-xs text-[color:var(--text-muted)] max-w-xs">
        Cette catégorie ne contient pas encore d'histoire.
      </p>
    </div>

    <!-- Grille des histoires -->
    <div id="stories-grid" class="hidden grid grid-cols-2 gap-3"></div>
  </main>

  <footer class="px-5 py-4 text-center text-xs text-[color:var(--text-muted)] border-t border-navy-line">
    MIJO Story — v0.2
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
